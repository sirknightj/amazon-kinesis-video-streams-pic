name: Build and test on ARM32

on:
  push:
    branches: [ master, develop ]
  pull_request:
    branches: [ master, develop ]

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    permissions:
      id-token: write
      contents: read

    name: Build on Arm32 Linux
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          image: tonistiigi/binfmt:qemu-v7.0.0-28

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Test
        env:
          AWS_KVS_LOG_LEVEL: 2
        run: |
          docker run --rm -v ${{ github.workspace }}:/workspace -w /workspace \
            -e AWS_KVS_LOG_LEVEL \
            --platform linux/arm/v7 arm32v7/ubuntu:jammy \
            /bin/bash -c '
              set -ex
              apt-get update
              apt-get install -y build-essential cmake git pkg-config

              mkdir -p build
              cd build

              cmake .. -DBUILD_TEST=ON -DBUILD_DEPENDENCIES=ON -DALIGNED_MEMORY_MODEL=ON
              if [ $? -ne 0 ]; then
                echo "CMake configuration failed!"
                exit 1
              fi

              echo "Listing contents of build directory:"
              ls -l

              max_retries=5
              attempt=0
              while [ $attempt -lt $max_retries ]; do
                attempt=$((attempt + 1))
                echo "Attempt $attempt of $max_retries..."

                set +e
                make -j
                exit_code=$?
                set -e
              
                if [ $exit_code -eq 0 ]; then
                  break
                fi
              
                echo "Build failed with exit code $exit_code - retrying..."
                sleep 5
              done
              
              if [ $exit_code -ne 0 ]; then
                echo "Build failed after $max_retries attempts."
                exit 1
              fi

              ./tst/kvspic_test --gtest_filter="*ClientApiTest.create*"
            '
