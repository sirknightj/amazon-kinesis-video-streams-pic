name: ARM32 Cross-Compile Test

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  arm32-test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Install ARM32 toolchain and QEMU
      run: |
        sudo apt-get update
        sudo apt-get install -y gcc-arm-linux-gnueabihf g++-arm-linux-gnueabihf qemu-user-static
    
    - name: Cross-compile for ARM32
      run: |
        mkdir build && cd build
        cmake .. -DBUILD_TEST=ON \
          -DCMAKE_SYSTEM_NAME=Linux \
          -DCMAKE_SYSTEM_PROCESSOR=arm \
          -DCMAKE_C_COMPILER=arm-linux-gnueabihf-gcc \
          -DCMAKE_CXX_COMPILER=arm-linux-gnueabihf-g++
        make -j$(nproc)
    
    - name: Run ClientApiTest.create* tests
      run: |
        cd build
        qemu-arm-static -L /usr/arm-linux-gnueabihf ./tst/kvspic_test --gtest_filter="*ClientApiTest.create*"
